<title>全屋 2K 原画监控 — 国内直连竞速导航</title>
<style>
  body { background:#060b16; color:#f8fafc; font-family:-apple-system,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:92vh; margin:0; padding:20px; text-align:center; }
  .spinner { width:36px; height:36px; border:3px solid rgba(56,189,248,0.25); border-top-color:#10b981; border-radius:50%; animation:sp 0.7s linear infinite; margin-bottom:14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .sub { font-size:13px; color:#94a3b8; margin-top:8px; line-height:1.65; max-width:360px; }
  .links { display:flex; flex-direction:column; gap:9px; margin-top:18px; width:100%; max-width:330px; }
  .btn { display:block; padding:11px 16px; border-radius:10px; background:#111c2f; color:#38bdf8; text-decoration:none; font-weight:700; font-size:13.5px; border:1px solid #293d5e; }
  .btn.green { background:rgba(16,185,129,0.16); color:#34d399; border-color:#10b981; }
</style>
<script>
(function() {
  var jumped = false;
  function go(u) {
    if (!jumped) { jumped = true; window.location.replace(u); }
  }
  function raceTargets(ep) {
    var list = [
      "http://192.168.1.138:15443",
      "http://192.168.137.1:15443",
      "http://1999.config.com:15443"
    ];
    if (ep) {
      if (ep.cn_ipv6_15443) list.push(ep.cn_ipv6_15443);
      if (ep.ipv6_direct) list.push(ep.ipv6_direct);
      if (ep.cn_ipv4_direct) list.push(ep.cn_ipv4_direct);
    } else {
      if ("http://[240e:363:3d51:af00:168d:50d:f256:dae7]:15443".indexOf("http") === 0) list.push("http://[240e:363:3d51:af00:168d:50d:f256:dae7]:15443");
      if ("http://[240e:363:3d51:af00:168d:50d:f256:dae7]:47822".indexOf("http") === 0) list.push("http://[240e:363:3d51:af00:168d:50d:f256:dae7]:47822");
      if ("http://117.65.227.59:15443".indexOf("http") === 0) list.push("http://117.65.227.59:15443");
    }
    list.forEach(function(u) {
      if (!u || u.indexOf("http") !== 0) return;
      var img = new Image();
      img.onload = function() { go(u + "/"); };
      img.src = u + "/apple-touch-icon.png?t=" + Date.now();
    });
  }
  raceTargets(null);
  fetch("./endpoints.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d) raceTargets(d); })
    .catch(function() {});
  setTimeout(function() { go("./index.html"); }, 1100);
})();
</script>
</head>
<body>

  <div style="font-size:16.5px;font-weight:800;">正在走国内网络毫秒级直连 2K 原画监控...</div>

  </div>

</html>
