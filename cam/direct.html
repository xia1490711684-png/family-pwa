<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="全屋2K监控">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>全屋 2K 原画监控 — 智能秒连</title>
<style>
  body { background:#060b16; color:#f8fafc; font-family:-apple-system,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:92vh; margin:0; padding:20px; text-align:center; }
  .spinner { width:36px; height:36px; border:3px solid rgba(56,189,248,0.25); border-top-color:#10b981; border-radius:50%; animation:sp 0.7s linear infinite; margin-bottom:14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .sub { font-size:13px; color:#94a3b8; margin-top:8px; line-height:1.6; max-width:340px; }
  .links { display:flex; flex-direction:column; gap:9px; margin-top:18px; width:100%; max-width:320px; }
  .btn { display:block; padding:11px 16px; border-radius:10px; background:#111c2f; color:#38bdf8; text-decoration:none; font-weight:700; font-size:13.5px; border:1px solid #293d5e; }
  .btn.green { background:rgba(16,185,129,0.16); color:#34d399; border-color:#10b981; }
</style>
<script>
(function() {
  var jumped = false;
  function go(u) { if (!jumped) { jumped = true; window.location.replace(u); } }
  var lanList = [
    "http://192.168.1.138:15443",
    "http://192.168.137.1:15443",
    "http://1999.config.com:15443"
  ];
  lanList.forEach(function(u) {
    var img = new Image();
    img.onload = function() { go(u + "/"); };
    img.src = u + "/apple-touch-icon.png?t=" + Date.now();
  });
  setTimeout(function() { go("./index.html"); }, 550);
})();
</script>
</head>
<body>
  <div class="spinner"></div>
  <div style="font-size:16.5px;font-weight:800;">正在智能连接全屋 2K 监控...</div>
  <div class="sub">在家自动毫秒级直连内网 2K · 在外自动切换外网安全隧道</div>
  <div class="links">
    <a class="btn green" href="./index.html">🌐 立即进入监控主画面（外网/5G 通用）</a>
    <a class="btn" href="http://192.168.1.138:15443/">🏠 家里光猫 Wi-Fi 内网直连</a>
    <a class="btn" href="http://192.168.137.1:15443/">📶 小米路由器 Wi-Fi 内网直连</a>
  </div>
</body>
</html>
