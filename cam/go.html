<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta http-equiv='Cache-Control' content='no-store,no-cache,must-revalidate'><title>全屋2K监控极速刷新</title><style>body{background:#0b1120;color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style></head><body><div>⚡ 正在切换至 v51 超清秒开流...</div><script>(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}if('caches' in window){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(e){}location.replace('./?fresh='+Date.now());})();</script></body></html>
